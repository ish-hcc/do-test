# Source VM 구성. 한 줄이 nodeGroup 안의 노드 하나다. idx 가 노드 번호(g1-<idx>)와 같다.
# 같은 구성을 onpremise, csp 두 네임스페이스에 똑같이 만든다.
#
# 열:  idx  이름  용도  포트  설치스크립트...
#   용도  migrate = 수집 + 이관 대상, collect = 수집만 확인
#   포트  보안그룹에 열 TCP 포트 (쉼표). 22 는 기본으로 열려 있다
#   설치  cm-grasshopper/examples/software-install-scripts 기준 상대경로.
#         @ 로 시작하면 이 skill 의 scripts/source/ 아래 파일이다
#
1  vm1-legacy     migrate  80,8080              legacy/apache/install-apache-legacy.sh legacy/tomcat/install-tomcat-legacy.sh
2  vm2-wp-nginx   migrate  80,111,2049,20048,32765,32766,32803 package/install-wordpress-nginx.sh package/install-nfs.sh
3  vm3-wp-apache  migrate  80,111,2049,20048,32765,32766,32803 package/install-wordpress-apache.sh package/install-nfs.sh
4  vm4-container  migrate  3306,8080            container/mariadb/install-mariadb-container.sh container/tomcat/install-tomcat-container.sh
5  haproxy        collect  80,8404              @install-docker.sh @install-haproxy-container.sh
6  minio          collect  9000,9001            @install-docker.sh @install-minio-container.sh
7  rdbms-mariadb  collect  3306                 @install-mariadb.sh
8  rdbms-mysql    collect  3306                 @install-mysql.sh
